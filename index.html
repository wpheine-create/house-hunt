<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Hunt 2026 — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#f7f6f3;--panel:#fff;--ink:#1f1d1a;--muted:#6b6660;--line:#e2ded7;
    --new:#5b7fd4;--short:#d98324;--tour:#2f9e6e;--pass:#a9a49d;--applied:#8b5cf6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  #wrap{display:flex;height:100vh;overflow:hidden}
  #side{width:400px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px}
  #controls{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
  select{width:100%;font:inherit;font-size:13px;padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff}
  input[type=range]{width:100%;padding:0;border:none}
  .rngval{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}
  #list{flex:1;overflow:auto}
  .card{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .card:hover{background:#faf9f6}
  .card.sel{background:#f0f4fc;box-shadow:inset 3px 0 0 var(--new)}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .addr{font-weight:600;letter-spacing:-.01em}
  .rent{font-variant-numeric:tabular-nums;white-space:nowrap}
  .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .commute{margin-top:6px;display:flex;gap:12px;font-size:12px;align-items:center;flex-wrap:wrap}
  .commute b{font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .pill{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .bus{border-color:#c98a3a;color:#a86c22}
  .lp{font-size:13px;min-width:255px}
  .lp h3{margin:0 0 2px;font-size:14px}
  .lp .g{color:var(--muted);font-size:12px}
  .lp table{border-collapse:collapse;margin:8px 0 4px;width:100%}
  .lp td{padding:1px 0;font-size:12px}
  .lp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .lp a{color:var(--new)}
  #foot{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:12px;line-height:1.7}
  @media(max-width:820px){#wrap{flex-direction:column}#side{width:100%;height:52%}#map{height:48%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <header>
      <h1>House Hunt 2026</h1>
      <div class="sub"><span id="count"></span> · door-to-door times from live Google Maps transit routing</div>
    </header>
    <div id="controls">
      <div><label>Sort</label><select id="sort">
        <option value="worst">Worst commute</option>
        <option value="rent">Rent</option>
        <option value="wt">Will's commute</option>
        <option value="mt">Madison's commute</option>
        <option value="sw">Walk to subway</option>
      </select></div>
      <div><label>Status</label><select id="status">
        <option value="">All</option><option>New</option><option>Shortlisted</option>
        <option>Want to see</option><option>Toured</option><option>Passed</option><option>Applied</option>
      </select></div>
      <div><label>Max rent <span class="rngval" id="rentv"></span></label><input type="range" id="rent" min="4100" max="5100" step="50"></div>
      <div><label>Max worst commute <span class="rngval" id="cmtv"></span></label><input type="range" id="cmt" min="35" max="55" step="1"></div>
    </div>
    <div id="list"></div>
    <div id="foot">Totals are door-to-door, whole-journey, including walking. Sampled off-peak — rush hour runs more frequently, so treat these as a fair comparison rather than an exact 9 AM figure. Per-leg breakdown lives in the sheet.</div>
  </div>
  <div id="map"></div>
</div>
<script>
const OFFICES=[
 {n:"Will",full:"Will — 770 Broadway",lat:40.730885,lng:-73.991638,c:"#5b7fd4"},
 {n:"Madison",full:"Madison — 909 Third Ave",lat:40.758283,lng:-73.967866,c:"#d98324"}];
const D=[
{id:"H-01",a:"430 Albee Square",u:"",nb:"Downtown Brooklyn",rent:4914,bd:2,ba:1,sq:null,av:"2026-08-05",lat:40.690719,lng:-73.983597,st:"Hoyt St",ln:"2 3",sw:2,wt:25,wm:"Subway",mt:38,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"FT Doorman · Condo, high-rise",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-02",a:"351 Smith Street",u:"",nb:"Carroll Gardens",rent:4995,bd:2,ba:1,sq:null,av:"Immediate",lat:40.679838,lng:-73.994918,st:"Carroll St",ln:"F G",sw:1,wt:25,wm:"Subway",mt:38,mm:"Bus + Subway",s:"Shortlisted",url:"",src:"OLR portal",am:"Voice intercom · Mixed use, low-rise",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-03",a:"201 Dean Street",u:"",nb:"Boerum Hill",rent:5000,bd:2,ba:1,sq:null,av:"2026-08-15",lat:40.685715,lng:-73.985509,st:"Hoyt-Schermerhorn Sts",ln:"A C G",sw:5,wt:31,wm:"Subway",mt:38,mm:"Subway",s:"Shortlisted",url:"",src:"OLR portal",am:"Voice intercom · Townhouse",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-04",a:"656 Dean Street",u:"",nb:"Prospect Heights",rent:4750,bd:2,ba:1,sq:null,av:"Immediate",lat:40.680061,lng:-73.96869,st:"Clinton-Washington Avs",ln:"C",sw:7,wt:36,wm:"Subway",mt:44,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"Voice intercom · Townhouse",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-05",a:"276 Degraw Street",u:"3",nb:"Cobble Hill",rent:4700,bd:2,ba:1,sq:1200,av:"2026-09-15",lat:40.683834,lng:-73.99639,st:"Carroll St",ln:"F G",sw:7,wt:32,wm:"Subway",mt:42,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/276-Degraw-St-3-Brooklyn-NY-11231/464208193_zpid/",src:"Zillow email",am:"Cats OK · 1,200 sqft",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-06",a:"736A Union Street",u:"Top",nb:"Park Slope",rent:5000,bd:2,ba:2,sq:null,av:"Immediate",lat:40.675514,lng:-73.97883,st:"Union St",ln:"R",sw:7,wt:32,wm:"Subway",mt:41,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/736A-Union-St-TOP-Brooklyn-NY-11215/464269843_zpid/",src:"Zillow email",am:"",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-07",a:"21 Columbia Place",u:"4B",nb:"Brooklyn Heights",rent:4995,bd:2,ba:1,sq:null,av:"Immediate",lat:40.693073,lng:-73.99838,st:"Court St",ln:"R",sw:9,wt:31,wm:"Subway",mt:41,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/21-Columbia-Pl-4B-Brooklyn-NY-11201/464251831_zpid/",src:"Zillow email",am:"Cats/dogs OK",ld:"In-unit",dw:"Not listed",ac:"Central"},
{id:"H-08",a:"175 9th Street",u:"1B",nb:"Park Slope",rent:4400,bd:3,ba:2,sq:null,av:"2026-10-01",lat:40.671867,lng:-73.99132,st:"4 Av-9 St",ln:"F G",sw:4,wt:31,wm:"Subway",mt:43,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/175-9th-St-1B-Brooklyn-NY-11215/464304825_zpid/",src:"Zillow email",am:"Cats/dogs OK",ld:"In-unit",dw:"Not listed",ac:"Not listed"},
{id:"H-09",a:"805 8th Avenue",u:"",nb:"Park Slope",rent:4700,bd:2,ba:1,sq:null,av:"Immediate",lat:40.666117,lng:-73.978634,st:"7 Av",ln:"F G",sw:2,wt:32,wm:"Subway",mt:43,mm:"Subway",s:"Shortlisted",url:"",src:"OLR portal",am:"Voice intercom · Low-rise",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-10",a:"566 7th Street",u:"1L",nb:"Park Slope",rent:5000,bd:2,ba:1,sq:null,av:"Immediate",lat:40.66631,lng:-73.97739,st:"7 Av",ln:"F G",sw:4,wt:34,wm:"Subway",mt:45,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/566-7th-St-1L-Brooklyn-NY-11215/464264332_zpid/",src:"Zillow email",am:"Cats/dogs OK",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-11",a:"559 Clinton Street",u:"3",nb:"Carroll Gardens",rent:4650,bd:2,ba:2,sq:null,av:"Immediate",lat:40.676468,lng:-74.000694,st:"Smith-9 Sts",ln:"F G",sw:8,wt:31,wm:"Subway",mt:42,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/559-Clinton-St-APT-3-Brooklyn-NY-11231/2109093807_zpid/",src:"Zillow email",am:"Cats/dogs OK",ld:"In-unit",dw:"Not listed",ac:"Central"},
{id:"H-12",a:"136 14th Street",u:"",nb:"Gowanus",rent:4800,bd:2,ba:2,sq:null,av:"Immediate",lat:40.668096,lng:-73.993232,st:"Prospect Av",ln:"R",sw:5,wt:32,wm:"Subway",mt:44,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"Virtual doorman · Condo, low-rise",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-13",a:"447 11th Street",u:"",nb:"Park Slope",rent:4195,bd:2,ba:1,sq:null,av:"Immediate",lat:40.666443,lng:-73.983749,st:"7 Av",ln:"F G",sw:5,wt:32,wm:"Subway",mt:43,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"Townhouse",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-14",a:"584 4th Avenue",u:"606",nb:"Gowanus",rent:4800,bd:2,ba:2,sq:null,av:"2026-09-01",lat:40.66584,lng:-73.992935,st:"Prospect Av",ln:"R",sw:1,wt:28,wm:"Subway",mt:41,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/584-4th-Ave-APT-606-Brooklyn-NY-11215/2056442364_zpid/",src:"Zillow email",am:"Elevator · Gym · Roof · No utilities incl.",ld:"In-unit",dw:"Yes",ac:"Central"},
{id:"H-15",a:"213 Prospect Avenue",u:"",nb:"South Slope",rent:4700,bd:2,ba:1,sq:null,av:"Immediate",lat:40.664943,lng:-73.99143,st:"Prospect Av",ln:"R",sw:2,wt:30,wm:"Subway",mt:43,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"Voice intercom · Townhouse",ld:"Not listed",dw:"Not listed",ac:"Not listed"},
{id:"H-16",a:"78 Prospect Park West",u:"1D",nb:"Park Slope",rent:4800,bd:2,ba:1,sq:null,av:"2026-09-04",lat:40.667934,lng:-73.97446,st:"7 Av",ln:"F G",sw:9,wt:40,wm:"Subway",mt:50,mm:"Subway",s:"New",url:"https://www.zillow.com/homedetails/78-Prospect-Park-W-APT-1D-Brooklyn-NY-11215/2089402144_zpid/",src:"Both sources",am:"Cats/dogs OK",ld:"In-unit",dw:"Not listed",ac:"Not listed"},
{id:"H-17",a:"85 Ryerson Street",u:"",nb:"Clinton Hill",rent:4700,bd:2,ba:2,sq:null,av:"Immediate",lat:40.695097,lng:-73.965076,st:"Clinton-Washington Avs",ln:"G",sw:13,wt:38,wm:"Bus + Subway",mt:44,mm:"Subway",s:"New",url:"",src:"OLR portal",am:"Voice intercom · Condo, townhouse",ld:"Not listed",dw:"Not listed",ac:"Not listed"}
];
D.forEach(d=>d.worst=Math.max(d.wt,d.mt));

const COL={"New":"#5b7fd4","Shortlisted":"#d98324","Want to see":"#d98324","Toured":"#2f9e6e","Passed":"#a9a49d","Applied":"#8b5cf6"};
const map=L.map('map').setView([40.685,-73.985],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19}).addTo(map);

const stationLayer=L.layerGroup().addTo(map);
fetch('https://data.ny.gov/resource/39hk-dx4f.json?$limit=2000').then(r=>r.json()).then(js=>{
  js.forEach(s=>{const la=+s.gtfs_latitude,lo=+s.gtfs_longitude;
    if(la<40.60||la>40.80||lo<-74.05||lo>-73.90)return;
    L.circleMarker([la,lo],{radius:2.5,weight:0,color:"#8a8378",fillOpacity:.55})
      .bindTooltip(s.stop_name+" ("+s.daytime_routes+")",{direction:'top'}).addTo(stationLayer);});
}).catch(()=>{});

OFFICES.forEach(o=>L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:
  `<div style="background:${o.c};color:#fff;font:600 10px/1 -apple-system,sans-serif;padding:5px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)">${o.n}'s office</div>`,
  iconAnchor:[30,10]})}).addTo(map).bindPopup(`<b>${o.full}</b>`));

const markers={};
D.forEach(d=>{
  const m=L.circleMarker([d.lat,d.lng],{radius:9,color:'#fff',weight:2,fillColor:COL[d.s]||'#5b7fd4',fillOpacity:.95})
    .addTo(map).bindPopup(popup(d));
  m.on('click',()=>select(d.id,false));
  markers[d.id]=m;
});

function popup(d){
  return `<div class="lp"><h3>${d.a}${d.u?' #'+d.u:''}</h3>
  <div class="g">${d.nb} · $${d.rent.toLocaleString()}/mo · ${d.bd} bd / ${d.ba} ba${d.sq?' · '+d.sq.toLocaleString()+' sqft':''}</div>
  <table>
    <tr><td><b>Will</b> — ${d.wm}</td><td><b>${d.wt} min</b></td></tr>
    <tr><td><b>Madison</b> — ${d.mm}</td><td><b>${d.mt} min</b></td></tr>
    <tr><td>Nearest subway</td><td>${d.st} (${d.ln}) · ${d.sw} min</td></tr>
    <tr><td>Laundry</td><td>${d.ld}</td></tr>
    <tr><td>Dishwasher</td><td>${d.dw}</td></tr>
    <tr><td>A/C</td><td>${d.ac}</td></tr>
    <tr><td>Available</td><td>${d.av}</td></tr>
  </table>
  ${d.am?`<div class="g">${d.am}</div>`:''}
  <div style="margin-top:6px">${d.url?`<a href="${d.url}" target="_blank">Listing ↗</a> · `:''}<a target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${d.lat},${d.lng}&destination=40.730885,-73.991638&travelmode=transit">Will's route ↗</a> · <a target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${d.lat},${d.lng}&destination=40.758283,-73.967866&travelmode=transit">Madison's ↗</a></div>
  <div class="g" style="margin-top:4px">${d.src}</div></div>`;
}

const $=id=>document.getElementById(id);
const rentEl=$('rent'),cmtEl=$('cmt');
rentEl.value=5100; cmtEl.value=55;
let sel=null;

function render(){
  const maxRent=+rentEl.value,maxCmt=+cmtEl.value,st=$('status').value,sort=$('sort').value;
  $('rentv').textContent='$'+maxRent.toLocaleString();
  $('cmtv').textContent=maxCmt+' min';
  let rows=D.filter(d=>d.rent<=maxRent&&d.worst<=maxCmt&&(!st||d.s===st));
  rows.sort((a,b)=>a[sort]-b[sort]);
  $('count').textContent=rows.length+' of '+D.length+' listings';
  $('list').innerHTML=rows.map(d=>`<div class="card${sel===d.id?' sel':''}" data-id="${d.id}">
    <div class="row1"><span class="addr"><span class="dot" style="background:${COL[d.s]}"></span>${d.a}${d.u?' #'+d.u:''}</span><span class="rent">$${d.rent.toLocaleString()}</span></div>
    <div class="meta">${d.nb} · ${d.bd} bd / ${d.ba} ba · ${d.st} (${d.ln}) ${d.sw} min walk</div>
    <div class="commute"><span>Will <b>${d.wt}m</b></span><span>Madison <b>${d.mt}m</b></span>
      ${(d.wm.includes('Bus')||d.mm.includes('Bus'))?'<span class="pill bus">Bus + Subway</span>':'<span class="pill">Subway</span>'}
      <span class="pill">${d.s}</span></div>
  </div>`).join('');
  Object.values(markers).forEach(m=>m.setStyle({opacity:.15,fillOpacity:.15}));
  rows.forEach(d=>markers[d.id].setStyle({opacity:1,fillOpacity:.95}));
  [...document.querySelectorAll('.card')].forEach(c=>c.onclick=()=>select(c.dataset.id,true));
}
function select(id,fly){
  sel=id;const d=D.find(x=>x.id===id);
  if(fly)map.setView([d.lat,d.lng],15,{animate:true});
  markers[id].openPopup();render();
  const c=document.querySelector('.card.sel');if(c)c.scrollIntoView({block:'nearest'});
}
['sort','status'].forEach(i=>$(i).onchange=render);
[rentEl,cmtEl].forEach(i=>i.oninput=render);
const lg=L.control({position:'bottomright'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');
  d.innerHTML=Object.entries(COL).slice(0,5).map(([k,v])=>`<span class="dot" style="background:${v}"></span>${k}`).join('<br>');return d;};
lg.addTo(map);
render();
</script>
</body>
</html>
