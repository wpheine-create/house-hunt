<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Hunt 2026 — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#f7f6f3;--panel:#fff;--ink:#1f1d1a;--muted:#6b6660;--line:#e2ded7;--new:#5b7fd4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  #wrap{display:flex;height:100vh;overflow:hidden}
  #side{width:400px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px}
  #controls{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
  select{width:100%;font:inherit;font-size:13px;padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff}
  input[type=range]{width:100%;padding:0;border:none}
  .rngval{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}
  #list{flex:1;overflow:auto}
  .card{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .card:hover{background:#faf9f6}
  .card.sel{background:#f0f4fc;box-shadow:inset 3px 0 0 var(--new)}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .addr{font-weight:600;letter-spacing:-.01em}
  .rent{font-variant-numeric:tabular-nums;white-space:nowrap}
  .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .commute{margin-top:6px;display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap}
  .commute b{font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .pill{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .bus{border-color:#c98a3a;color:#a86c22}
  .star{color:#d98324;font-size:12px;letter-spacing:1px}
  .lp{font-size:13px;min-width:255px}
  .lp h3{margin:0 0 2px;font-size:14px}
  .lp .g{color:var(--muted);font-size:12px}
  .lp table{border-collapse:collapse;margin:8px 0 4px;width:100%}
  .lp td{padding:1px 0;font-size:12px}
  .lp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .lp a{color:var(--new)}
  .note{background:#faf7f0;border-left:2px solid #d98324;padding:4px 7px;margin-top:6px;font-size:12px}
  #foot{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  #foot a{color:var(--new)}
  .legend{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:12px;line-height:1.7}
  #err{padding:20px 16px;color:#a33;font-size:13px}
  @media(max-width:820px){#wrap{flex-direction:column}#side{width:100%;height:52%}#map{height:48%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <header>
      <h1>House Hunt 2026</h1>
      <div class="sub"><span id="count">Loading from the sheet…</span></div>
    </header>
    <div id="controls">
      <div><label>Sort</label><select id="sort">
        <option value="worst">Worst commute</option>
        <option value="rent">Rent</option>
        <option value="wt">Will's commute</option>
        <option value="mt">Madison's commute</option>
        <option value="sw">Walk to subway</option>
        <option value="rating">Our rating</option>
        <option value="gap">Biggest disagreement</option>
      </select></div>
      <div><label>Status</label><select id="status"><option value="">All</option></select></div>
      <div><label>Max rent <span class="rngval" id="rentv"></span></label><input type="range" id="rent"></div>
      <div><label>Max worst commute <span class="rngval" id="cmtv"></span></label><input type="range" id="cmt"></div>
    </div>
    <div id="list"></div>
    <div id="foot">
      Reads live from the shared Google Sheet — edit there, refresh here.
      Commutes are door-to-door including walking, from Google Maps transit routing.
      <a href="#" id="reload">Reload data</a>
    </div>
  </div>
  <div id="map"></div>
</div>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS6MmoWKvOUExZ7aMksG_ya4qtySFzTM_9KzJZ9j5au--VzFRKbwgCHaiXH9JbdMsoXsfrA2i6ij1cg/pub?output=csv";
const WILL=[40.730885,-73.991638], MAD=[40.758283,-73.967866];
const OFFICES=[{n:"Will",full:"Will — 770 Broadway",lat:WILL[0],lng:WILL[1],c:"#5b7fd4"},
               {n:"Madison",full:"Madison — 909 Third Ave",lat:MAD[0],lng:MAD[1],c:"#d98324"}];
const COL={"New":"#5b7fd4","Shortlisted":"#d98324","Want to see":"#d98324","Toured":"#2f9e6e","Passed":"#a9a49d","Applied":"#8b5cf6"};

const map=L.map('map').setView([40.685,-73.985],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19}).addTo(map);
const stationLayer=L.layerGroup().addTo(map);
fetch('https://data.ny.gov/resource/39hk-dx4f.json?$limit=2000').then(r=>r.json()).then(js=>{
  js.forEach(s=>{const la=+s.gtfs_latitude,lo=+s.gtfs_longitude;
    if(la<40.60||la>40.80||lo<-74.05||lo>-73.90)return;
    L.circleMarker([la,lo],{radius:2.5,weight:0,color:"#8a8378",fillOpacity:.55})
      .bindTooltip(s.stop_name+" ("+s.daytime_routes+")",{direction:'top'}).addTo(stationLayer);});
}).catch(()=>{});
OFFICES.forEach(o=>L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:
  `<div style="background:${o.c};color:#fff;font:600 10px/1 -apple-system,sans-serif;padding:5px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)">${o.n}'s office</div>`,
  iconAnchor:[30,10]})}).addTo(map).bindPopup(`<b>${o.full}</b>`));

function parseCSV(txt){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c=='"'&&txt[i+1]=='"'){cell+='"';i++} else if(c=='"'){q=false} else cell+=c }
    else{ if(c=='"')q=true;
      else if(c==','){row.push(cell);cell=''}
      else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else if(c!='\r')cell+=c }}
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.length>1&&r.some(x=>x!==''));
}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n};

let D=[],markers={},sel=null;
const $=id=>document.getElementById(id);

async function load(){
  const txt=await (await fetch(CSV_URL,{cache:"no-store"})).text();
  const rows=parseCSV(txt), h=rows[0].map(x=>x.trim()), ix=n=>h.indexOf(n);
  D=rows.slice(1).map(r=>{
    const g=n=>{const i=ix(n);return i<0?'':(r[i]||'').trim()};
    const wt=num(g('Will Total (min)')), mt=num(g('Madison Total (min)'));
    return {id:g('ID'),a:g('Address'),u:g('Unit'),nb:g('Neighborhood'),
      rent:num(g('Rent')),bd:g('Beds'),ba:g('Baths'),sq:num(g('Sqft')),
      av:g('Available'),lat:num(g('Lat')),lng:num(g('Lng')),
      st:g('Nearest Subway'),ln:g('Lines'),sw:num(g('Walk to Subway (min)')),
      wt,mt,wm:g('Will Modes')||'Subway',mm:g('Madison Modes')||'Subway',
      worst:num(g('Worst Total (min)'))||Math.max(wt||0,mt||0),
      s:g('Status')||'New',url:g('Listing URL'),src:g('Source'),
      ld:g('Laundry')||'—',dw:g('Dishwasher')||'—',ac:g('A/C')||'—',am:g('Amenities'),
      wr:num(g('Will Rating')),mr:num(g('Madison Rating')),
      gap:num(g('Gap')),rating:num(g('Combined')),
      wn:g('Will Notes'),mn:g('Madison Notes')};
  }).filter(d=>d.id&&d.lat&&d.lng);

  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  D.forEach(d=>{
    const m=L.circleMarker([d.lat,d.lng],{radius:9,color:'#fff',weight:2,
      fillColor:COL[d.s]||'#5b7fd4',fillOpacity:.95}).addTo(map).bindPopup(popup(d));
    m.on('click',()=>select(d.id,false)); markers[d.id]=m;
  });

  const statuses=[...new Set(D.map(d=>d.s))].sort();
  $('status').innerHTML='<option value="">All</option>'+statuses.map(s=>`<option>${s}</option>`).join('');
  const rents=D.map(d=>d.rent).filter(Boolean), cms=D.map(d=>d.worst).filter(Boolean);
  const rE=$('rent'),cE=$('cmt');
  rE.min=Math.floor(Math.min(...rents)/50)*50; rE.max=Math.ceil(Math.max(...rents)/50)*50; rE.step=50; rE.value=rE.max;
  cE.min=Math.min(...cms); cE.max=Math.max(...cms); cE.step=1; cE.value=cE.max;
  render();
}

function stars(n){return n?'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n)):''}

function popup(d){
  const notes=[d.wn&&`<b>Will:</b> ${d.wn}`,d.mn&&`<b>Madison:</b> ${d.mn}`].filter(Boolean).join('<br>');
  return `<div class="lp"><h3>${d.a}${d.u?' #'+d.u:''}</h3>
  <div class="g">${d.nb} · $${(d.rent||0).toLocaleString()}/mo · ${d.bd} bd / ${d.ba} ba${d.sq?' · '+d.sq.toLocaleString()+' sqft':''}</div>
  <table>
    <tr><td><b>Will</b> — ${d.wm}</td><td><b>${d.wt} min</b></td></tr>
    <tr><td><b>Madison</b> — ${d.mm}</td><td><b>${d.mt} min</b></td></tr>
    <tr><td>Nearest subway</td><td>${d.st} (${d.ln}) · ${d.sw} min</td></tr>
    <tr><td>Laundry</td><td>${d.ld}</td></tr>
    <tr><td>Dishwasher</td><td>${d.dw}</td></tr>
    <tr><td>A/C</td><td>${d.ac}</td></tr>
    <tr><td>Available</td><td>${d.av}</td></tr>
    ${d.wr||d.mr?`<tr><td>Ratings</td><td>W ${d.wr||'–'} · M ${d.mr||'–'}${d.gap>=2?' ⚠':''}</td></tr>`:''}
  </table>
  ${d.am?`<div class="g">${d.am}</div>`:''}
  ${notes?`<div class="note">${notes}</div>`:''}
  <div style="margin-top:6px">${d.url?`<a href="${d.url}" target="_blank">Listing ↗</a> · `:''}<a target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${d.lat},${d.lng}&destination=${WILL}&travelmode=transit">Will's route ↗</a> · <a target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${d.lat},${d.lng}&destination=${MAD}&travelmode=transit">Madison's ↗</a></div>
  <div class="g" style="margin-top:4px">${d.src}</div></div>`;
}

function render(){
  const maxRent=+$('rent').value,maxCmt=+$('cmt').value,st=$('status').value,sort=$('sort').value;
  $('rentv').textContent='$'+maxRent.toLocaleString();
  $('cmtv').textContent=maxCmt+' min';
  let rows=D.filter(d=>(d.rent||0)<=maxRent&&d.worst<=maxCmt&&(!st||d.s===st));
  if(sort==='rating') rows.sort((a,b)=>(b.rating||-1)-(a.rating||-1));
  else if(sort==='gap') rows.sort((a,b)=>(b.gap||-1)-(a.gap||-1));
  else rows.sort((a,b)=>a[sort]-b[sort]);
  $('count').textContent=`${rows.length} of ${D.length} listings · live from the sheet`;
  $('list').innerHTML=rows.map(d=>`<div class="card${sel===d.id?' sel':''}" data-id="${d.id}">
    <div class="row1"><span class="addr"><span class="dot" style="background:${COL[d.s]||'#5b7fd4'}"></span>${d.a}${d.u?' #'+d.u:''}</span><span class="rent">$${(d.rent||0).toLocaleString()}</span></div>
    <div class="meta">${d.nb} · ${d.bd} bd / ${d.ba} ba · ${d.st} (${d.ln}) ${d.sw} min walk</div>
    <div class="commute"><span>Will <b>${d.wt}m</b></span><span>Madison <b>${d.mt}m</b></span>
      ${(d.wm+d.mm).includes('Bus')?'<span class="pill bus">Bus + Subway</span>':'<span class="pill">Subway</span>'}
      <span class="pill">${d.s}</span>
      ${d.rating?`<span class="star" title="Combined ${d.rating}">${stars(d.rating)}</span>`:''}
      ${d.gap>=2?'<span class="pill bus">Gap '+d.gap+'</span>':''}</div>
  </div>`).join('');
  Object.values(markers).forEach(m=>m.setStyle({opacity:.15,fillOpacity:.15}));
  rows.forEach(d=>markers[d.id]&&markers[d.id].setStyle({opacity:1,fillOpacity:.95}));
  [...document.querySelectorAll('.card')].forEach(c=>c.onclick=()=>select(c.dataset.id,true));
}
function select(id,fly){
  sel=id;const d=D.find(x=>x.id===id);if(!d)return;
  if(fly)map.setView([d.lat,d.lng],15,{animate:true});
  markers[id].openPopup();render();
  const c=document.querySelector('.card.sel');if(c)c.scrollIntoView({block:'nearest'});
}
['sort','status'].forEach(i=>$(i).onchange=render);
['rent','cmt'].forEach(i=>$(i).oninput=render);
$('reload').onclick=e=>{e.preventDefault();$('count').textContent='Reloading…';load().catch(fail)};

const lg=L.control({position:'bottomright'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');
  d.innerHTML=Object.entries(COL).slice(0,5).map(([k,v])=>`<span class="dot" style="background:${v}"></span>${k}`).join('<br>');return d;};
lg.addTo(map);

function fail(e){
  $('count').textContent='Could not load the sheet';
  $('list').innerHTML=`<div id="err">Couldn't reach the published sheet. Check that it's still published to the web (File → Share → Publish to web), then reload.<br><br><span style="color:#6b6660">${e}</span></div>`;
}
load().catch(fail);
</script>
</body>
</html>
